<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çay ocağı · örnek simülasyon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#1E1712;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Demli · çay ocağı örnek simülasyonu
   Demlik sırayla bardakları doldurur; biri taşar, biri az kalır.
   ?capture ile sabit tohum ve sabit adım: her açılışta aynı kare. */
(function () {
  'use strict';
  var CAPTURE = /[?&]capture\b/.test(location.search);
  var W = 1600, H = 900;                       // tasarım çözünürlüğü
  var R = { kagit: '#F7EEE4', murekkep: '#16130F', cay: '#AD341B', cay2: '#DC6C21', altin: '#D49B26',
            demlik: '#1E1712', demlik2: '#2A2019', soluk: '#B9A894', gri: '#5B6670', grii: '#8C97A1' };
  var GLASS = new Path2D('M8 4 L52 4 C50 18 42 28 42 38 C42 50 55 64 53 82 C52 93 44 98 30 98 C16 98 8 93 7 82 C5 64 18 50 18 38 C18 28 10 18 8 4 Z');
  var KAPAK = new Path2D('M4.4 19 L4.6 7 C4.6 0.5 12 -3.8 30 -3.8 C48 -3.8 55.4 0.5 55.4 7 L55.6 14.5 C55.6 17.4 52.4 17.4 52.4 14.5 L52.2 9.4 L8 9.4 L7.8 19 C7.8 22 4.4 22 4.4 19 Z');
  var KAPAK_KONTUR = new Path2D('M52.2 9.4 L52.4 14.5 C52.4 17.4 55.6 17.4 55.6 14.5 L55.4 7 C55.4 0.5 48 -3.8 30 -3.8 C12 -3.8 4.6 0.5 4.6 7 L4.4 19 C4.4 22 7.8 22 7.8 19 L8 9.6');
  var KUBBE = new Path2D('M5.6 6 C6 0.5 13 -2.6 30 -2.6 C47 -2.6 54 0.5 54.4 6 Z');
  var KUBBE_KONTUR = new Path2D('M5.6 6 C6 0.5 13 -2.6 30 -2.6 C47 -2.6 54 0.5 54.4 6');
  var KAPAK_IS = new Path2D('M9.5 1.6 C17 -1.6 43 -1.6 50.5 1.6');
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var olcek = 1, ox = 0, oy = 0, dpr = 1;

  function boyut() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
    olcek = Math.min(cv.width / W, cv.height / H);
    ox = (cv.width - W * olcek) / 2; oy = (cv.height - H * olcek) / 2;
    if (bardaklar) ciz(saat);                       // boyut değişince tuval silinir: hemen yeniden çiz
  }
  addEventListener('resize', boyut); boyut();

  // tohumlu rastgele (mulberry32)
  function rng(t) { return function () { t |= 0; t = t + 0x6D2B79F5 | 0; var r = Math.imul(t ^ t >>> 15, 1 | t); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }

  var N = 5, GS = 2.55;                        // bardak sayısı, bardak ölçeği (60x98 -> 153x250)
  var TEZGAH = 760;
  var bardaklar, demlik, tur = 0, rnd, durum, bekle;

  function yeniTur() {
    rnd = rng(CAPTURE ? 7 : 7 + tur * 13);
    var hedefler = [0.78, 0.92, 1.14, 0.42, 0.86];
    // her turda sıra karışır, değerler hafif oynar
    for (var i = hedefler.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = hedefler[i]; hedefler[i] = hedefler[j]; hedefler[j] = t; }
    bardaklar = [];
    var bosluk = W / (N + 1) * 0.96, bas = W / 2 - bosluk * (N - 1) / 2;
    for (i = 0; i < N; i++) {
      bardaklar.push({ x: bas + i * bosluk, sev: 0, hedef: Math.round((hedefler[i] + (rnd() - .5) * .04) * 100) / 100,
                       bitti: false, gol: 0, damlalar: [], buhar: rnd() * 6, dalga: 0, yazi: 0 });
    }
    demlik = { x: -160, y: 250, egim: 0, hedef: 0 };
    durum = 'git'; bekle = 0;
  }

  /* ---------------------------------------------------------------- çizim */
  function bardakCiz(b, t) {
    var x0 = b.x - 30 * GS, y0 = TEZGAH - 101 * GS;
    // tabak
    ctx.save();
    ctx.beginPath(); ctx.ellipse(b.x, TEZGAH - 4, 96, 17, 0, 0, Math.PI * 2);
    ctx.fillStyle = R.demlik2; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = R.kagit; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(b.x, TEZGAH - 5, 66, 10, 0, 0, Math.PI * 2);
    ctx.lineWidth = 2; ctx.strokeStyle = R.altin; ctx.stroke();
    if (b.gol > 0) {                                     // tabağa taşan çay
      ctx.beginPath(); ctx.ellipse(b.x + 52, TEZGAH - 5, 30 * b.gol, 7 * b.gol, 0, 0, Math.PI * 2);
      ctx.fillStyle = R.cay; ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(x0, y0); ctx.scale(GS, GS);
    ctx.fillStyle = R.demlik2; ctx.fill(GLASS);
    ctx.save(); ctx.clip(GLASS);
    var sev = Math.min(b.sev, 1), y = 98 - 94 * sev;
    if (sev > 0.002) {
      var dal = Math.sin(t * 5 + b.x) * 1.1 * b.dalga;
      ctx.fillStyle = R.cay;
      ctx.beginPath(); ctx.moveTo(0, y + dal); ctx.lineTo(60, y - dal); ctx.lineTo(60, 110); ctx.lineTo(0, 110); ctx.closePath(); ctx.fill();
      // halftone gölge
      ctx.fillStyle = 'rgba(22,19,15,.38)';
      for (var yy = Math.ceil(y) + 2; yy < 100; yy += 3.2) for (var xx = 36 + ((yy / 3.2) % 2) * 1.6; xx < 58; xx += 3.2) { ctx.beginPath(); ctx.arc(xx, yy, .6, 0, 6.283); ctx.fill(); }
      ctx.beginPath(); ctx.ellipse(30, y, 30, 2.2, -dal / 30, 0, Math.PI * 2); ctx.fillStyle = R.cay2; ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(14, 26); ctx.bezierCurveTo(12, 48, 13, 68, 16, 86); ctx.stroke();
    ctx.restore();
    ctx.lineWidth = 1.7; ctx.lineJoin = 'round'; ctx.strokeStyle = R.kagit; ctx.stroke(GLASS);
    if (b.sev > 1) {                                     // taşma: rim üstünde kubbe, iki yandan sarkan çay
      var tam = b.sev > 1.04;
      ctx.fillStyle = R.cay; ctx.fill(tam ? KAPAK : KUBBE);
      ctx.strokeStyle = R.cay2; ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.stroke(KAPAK_IS);
      ctx.strokeStyle = R.kagit; ctx.lineWidth = 1.2; ctx.stroke(tam ? KAPAK_KONTUR : KUBBE_KONTUR);
    }
    ctx.restore();

    // damlalar
    ctx.fillStyle = R.cay;
    b.damlalar.forEach(function (d) { ctx.beginPath(); ctx.ellipse(d.x, d.y, 5, 7, 0, 0, Math.PI * 2); ctx.fill(); });

    // buhar
    if (b.bitti && b.hedef >= 0.6) {
      ctx.save(); ctx.strokeStyle = R.soluk; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (var k = 0; k < 2; k++) {
        var f = ((t * .45 + b.buhar + k * .5) % 1);
        ctx.globalAlpha = Math.sin(f * Math.PI) * .7 * Math.min(1, b.yazi);
        var bx = b.x - 14 + k * 28, by = y0 - 20 - f * 70;
        ctx.beginPath(); ctx.moveTo(bx, by + 50);
        ctx.bezierCurveTo(bx - 14, by + 34, bx + 14, by + 18, bx, by);
        ctx.stroke();
      }
      ctx.restore();
    }

    // puan etiketi
    if (b.yazi > 0) {
      ctx.save(); ctx.globalAlpha = Math.min(1, b.yazi);
      var oy2 = TEZGAH + 80 + (1 - Math.min(1, b.yazi)) * 18;
      var tasti = b.hedef > 1, az = b.hedef < .6;
      ctx.textAlign = 'center';
      ctx.font = '800 56px "Bricolage Grotesque", sans-serif';
      ctx.fillStyle = tasti ? R.cay2 : az ? R.grii : R.kagit;
      ctx.fillText(Math.round(b.hedef * 100), b.x, oy2);
      ctx.font = '500 20px "JetBrains Mono", monospace';
      ctx.fillStyle = R.soluk;
      ctx.fillText(tasti ? 'taştı' : az ? 'az kaldı' : 'tamam', b.x, oy2 + 34);
      ctx.restore();
    }
  }

  function demlikCiz(d, t) {
    ctx.save();
    ctx.translate(d.x, d.y); ctx.rotate(d.egim);
    ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = R.murekkep;
    // kulp
    ctx.beginPath(); ctx.moveTo(-92, -30); ctx.bezierCurveTo(-150, -40, -150, 50, -86, 40);
    ctx.lineWidth = 12; ctx.strokeStyle = R.kagit; ctx.stroke();
    // emzik
    ctx.beginPath(); ctx.moveTo(78, 10); ctx.bezierCurveTo(120, 4, 128, -28, 156, -44); ctx.lineTo(162, -34);
    ctx.bezierCurveTo(140, -16, 130, 32, 84, 44); ctx.closePath();
    ctx.fillStyle = R.kagit; ctx.fill();
    // gövde
    ctx.beginPath(); ctx.moveTo(-96, -30); ctx.bezierCurveTo(-110, 40, -70, 78, 0, 78); ctx.bezierCurveTo(70, 78, 110, 40, 96, -30);
    ctx.bezierCurveTo(70, -52, -70, -52, -96, -30); ctx.closePath(); ctx.fillStyle = R.kagit; ctx.fill();
    // altın çift bant
    ctx.save(); ctx.clip();
    ctx.strokeStyle = R.altin; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-120, 18); ctx.quadraticCurveTo(0, 40, 120, 18); ctx.stroke();
    ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-120, 30); ctx.quadraticCurveTo(0, 52, 120, 30); ctx.stroke();
    // halftone
    ctx.fillStyle = 'rgba(22,19,15,.22)';
    for (var yy = -40; yy < 80; yy += 7) for (var xx = 40 + (yy % 14 ? 3.5 : 0); xx < 110; xx += 7) { ctx.beginPath(); ctx.arc(xx, yy, 1.4, 0, 6.283); ctx.fill(); }
    ctx.restore();
    // kapak
    ctx.beginPath(); ctx.ellipse(0, -38, 70, 13, 0, 0, Math.PI * 2); ctx.fillStyle = R.kagit; ctx.fill();
    ctx.strokeStyle = R.demlik; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -56, 14, 10, 0, 0, Math.PI * 2); ctx.fillStyle = R.kagit; ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function emzikUcu(d) {
    var c = Math.cos(d.egim), s = Math.sin(d.egim), px = 159, py = -39;
    return { x: d.x + px * c - py * s, y: d.y + px * s + py * c };
  }

  /* ---------------------------------------------------------------- güncelle */
  var aktifNo = 0;
  function adimAt(dt, t) {
    var b = bardaklar[aktifNo];
    if (durum === 'git') {
      var hx = b.x - 168;
      demlik.x += (hx - demlik.x) * Math.min(1, dt * 4.5);
      demlik.egim += (0 - demlik.egim) * Math.min(1, dt * 6);
      if (Math.abs(hx - demlik.x) < 3) durum = 'egil';
    } else if (durum === 'egil') {
      demlik.egim += (0.52 - demlik.egim) * Math.min(1, dt * 7);
      if (demlik.egim > 0.5) durum = 'dok';
    } else if (durum === 'dok') {
      b.sev += dt * (b.sev > 1 ? 0.15 : 0.62); b.dalga = 1;
      if (b.sev > 1) {                                  // taşma: kenardan damla
        b.taskan = (b.taskan || 0) + dt;
        if (b.taskan > 0.16) { b.taskan = 0; b.damlalar.push({ x: b.x + 26 * GS - 4, y: TEZGAH - 101 * GS + 22 * GS, vy: 40 }); }
      }
      if (b.sev >= b.hedef) { b.sev = b.hedef; durum = 'kalk'; }
    } else if (durum === 'kalk') {
      demlik.egim += (0 - demlik.egim) * Math.min(1, dt * 7);
      if (demlik.egim < 0.03) {
        b.bitti = true;
        aktifNo++;
        if (aktifNo >= N) { durum = 'bitti'; bekle = 0; } else durum = 'git';
      }
    } else if (durum === 'bitti') {
      demlik.x += (W + 220 - demlik.x) * Math.min(1, dt * 1.6);
      bekle += dt;
      if (bekle > (CAPTURE ? 1e9 : 5.5)) durum = 'ic';
    } else if (durum === 'ic') {
      var hep = true;
      bardaklar.forEach(function (g) { g.sev = Math.max(0, g.sev - dt * .7); g.gol = Math.max(0, g.gol - dt); g.yazi = Math.max(0, g.yazi - dt * 3); if (g.sev > 0) hep = false; });
      if (hep) { tur++; aktifNo = 0; yeniTur(); }
    }
    bardaklar.forEach(function (g) {
      g.dalga = Math.max(0, g.dalga - dt * .8);
      if (g.bitti && durum !== 'ic') g.yazi = Math.min(1.2, g.yazi + dt * 2.6);
      g.damlalar.forEach(function (d) { d.vy += 900 * dt; d.y += d.vy * dt; });
      var once = g.damlalar.length;
      g.damlalar = g.damlalar.filter(function (d) { return d.y < TEZGAH - 8; });
      if (g.damlalar.length < once) g.gol = Math.min(1, g.gol + .14 * (once - g.damlalar.length));
    });
  }

  function ciz(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = R.demlik; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(olcek, 0, 0, olcek, ox, oy);

    // arka: ince halftone alan
    ctx.fillStyle = 'rgba(220,108,33,.10)';
    for (var y = 60; y < 520; y += 16) for (var x = 980 + ((y / 16) % 2) * 8; x < 1560; x += 16) {
      var dx = (x - 1320) / 300, dy = (y - 280) / 240, r = 1 - (dx * dx + dy * dy);
      if (r > 0) { ctx.beginPath(); ctx.arc(x, y, 1.9 * Math.min(1, r * 1.6), 0, 6.283); ctx.fill(); }
    }

    // başlık
    ctx.textAlign = 'left';
    ctx.font = '500 24px "JetBrains Mono", monospace'; ctx.fillStyle = R.cay2;
    ctx.fillText('> çay ocağı · örnek simülasyon', 64, 78);
    var dolan = bardaklar.filter(function (b) { return b.bitti; }).length;
    ctx.textAlign = 'right'; ctx.fillStyle = R.soluk;
    ctx.fillText('demlenen ' + dolan + ' / ' + N + '   tur ' + String(tur + 1).padStart(2, '0'), W - 64, 78);

    // tezgah: altın çift çizgi
    ctx.fillStyle = R.altin; ctx.fillRect(40, TEZGAH + 8, W - 80, 3); ctx.fillRect(40, TEZGAH + 15, W - 80, 1.5);

    bardaklar.forEach(function (b) { bardakCiz(b, t); });

    // dökülen çay
    if (durum === 'dok') {
      var u = emzikUcu(demlik), b = bardaklar[aktifNo];
      var yuzey = TEZGAH - 101 * GS + (98 - 94 * Math.min(b.sev, 1)) * GS;
      ctx.save(); ctx.strokeStyle = R.cay; ctx.lineCap = 'round'; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(u.x, u.y);
      ctx.bezierCurveTo(u.x + 22, u.y + 8, b.x + Math.sin(t * 18) * 1.5, u.y + 40, b.x, yuzey);
      ctx.stroke();
      ctx.strokeStyle = R.cay2; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(u.x + 2, u.y + 2);
      ctx.bezierCurveTo(u.x + 22, u.y + 8, b.x - 2, u.y + 40, b.x - 2, yuzey - 4); ctx.stroke();
      ctx.restore();
    }
    demlikCiz(demlik, t);
  }

  /* ---------------------------------------------------------------- döngü */
  yeniTur();
  var son = null, saat = 0, ADIM = 1 / 60;
  // ?on=8 : sahneyi 8 saniye ileriden başlat (kayıt ve ekran görüntüsü için)
  var on = parseFloat((/[?&]on=([\d.]+)/.exec(location.search) || [])[1] || '0');
  for (var i = 0; i < on * 60; i++) { saat += ADIM; adimAt(ADIM, saat); }
  function kare(ts) {
    if (son === null) son = ts;
    var gecen = Math.min(0.1, (ts - son) / 1000); son = ts;
    if (CAPTURE) {                                      // sabit adım: deterministik
      saat += ADIM; adimAt(ADIM, saat);
    } else {
      saat += gecen;
      var kalan = gecen;
      while (kalan > 1e-6) { var d = Math.min(ADIM, kalan); adimAt(d, saat); kalan -= d; }
    }
    ciz(saat);
    sonraki(kare);
  }
  // capture: sabit 16 ms zamanlayıcı (headless tarayıcıda da kare üretir)
  var sonraki = CAPTURE ? function (f) { setTimeout(function () { f(performance.now()); }, 16); } : function (f) { requestAnimationFrame(f); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () { sonraki(kare); });
})();
</script>
</body>
</html>
